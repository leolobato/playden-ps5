name: Game test report
description: Tell me how a game ran on Playden, whether it worked or not.
title: "[Test] <game name>"
labels: ["test report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Reports of games that **work** help as much as reports of games that don't.
        Check the [compatibility list](https://github.com/leolobato/playden-ps5/blob/main/COMPATIBILITY.md) first. If the game is there, add what is new.
        If you know the game already has a report for your copy, even a closed one, you can comment there instead.
        A new report is fine too.

        If the game did not work, collect the logs **after you start Playden once more** (Playden copies the
        game's log when it starts), while it is open.
        On a phone or computer on the same network, open Playden's web page (Settings > Web access shows the
        address and a QR code). In the **Logs** tab, pick the game and choose **Download report (.zip)**.
        Without the web page, run `python3 tools/collect_logs.py --host <PS5 IP>` from your computer
        (it needs an FTP server on the PS5 on port 2120, such as zftpd).

        Paste the table from the zip's `summary.md` (or the one the script prints) into **Versions** and attach the zip below.
        If you changed any Game settings, choose **Export as file** (Game settings > Advanced) for the game, then attach
        the recipe file too: on the web page, **Game files** > the game > **Download exported recipe**.
        See the [sample report](https://github.com/leolobato/playden-ps5/blob/main/docs/sample-test-report.md).
  - type: input
    id: game
    attributes:
      label: Game
      description: The name and its store link, on the Steam store or gog.com (the link names the game). For an imported game, its name and where it comes from (GOG, Epic, a disc).
      placeholder: "Vampire Survivors — https://store.steampowered.com/app/1794680"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Result
      options:
        - "✅ Works: reaches the menu and plays"
        - "🟡 Partial: plays, with a problem that gets in the way"
        - "❌ Broken: starts, but is not playable"
        - "❌ Does not start: back to Home, or stays on the spinner"
        - "⛔ Refused: Playden would not prepare it (say below whether Try anyway or another Program helped)"
        - "Download or preparation failed"
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Paste the table from the report's `summary.md` or `collect_logs.py`. Without it, give the firmware, the Playden commit and the kit.
      placeholder: |
        | Field | Value |
        | --- | --- |
        | firmware | 13.60 |
        | kit runtime | ... |
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Where the game is installed
      options:
        - Console storage
        - M.2 SSD
        - exFAT USB drive
        - Imported, played where it is (drop folder or a drive's playden/import)
        - Other (say below)
    validations:
      required: true
  - type: checkboxes
    id: input
    attributes:
      label: Controls
      description: What did you play with? Tick all that apply.
      options:
        - label: DualSense, default (Xbox controller)
        - label: DualSense, Mouse preset
        - label: DualSense, Arrow keys preset
        - label: USB mouse and keyboard
  - type: textarea
    id: settings
    attributes:
      label: Game settings you changed
      description: |
        Program, required or extra arguments, library overrides, Try anyway, graphics, controller preset or anything else. Leave empty if none.
        Please also choose **Export as file** (Game settings > Advanced) and attach the recipe file under **Logs and screenshots**: get it from the web page (**Game files** > the game > **Download exported recipe**) or from `/data/playden/exported-recipes` over FTP. The report zip doesn't include it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: |
        What you did and what you saw, step by step. How far did the game get? Frame rate if you know it.
        For a problem: what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        Drag the report zip (from the web page or `collect_logs.py`) here, and the exported recipe file if you have one.
        Logs are required when the game did not work.
        Your Steam account name is removed, but look through the logs before you post them.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: kstuff and ShadowMountPlus were loaded when I tested.
          required: true
        - label: I own this game (on Steam, or a copy I bought for an imported game).
          required: true
